<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScheduleFreeTime - Free Time Availability Calendar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --bg-subtle: #12121a;
      --fg: #e8e8f0;
      --muted: #6b6b80;
      --accent: #00d4aa;
      --accent-dim: rgba(0, 212, 170, 0.15);
      --danger: #ff4757;
      --warning: #ffa502;
      --card: #1a1a24;
      --border: #2a2a3a;
      --free-bg: #00d4aa;
      --free-text: #0a0a0f;
      --occupied-bg: #ff4757;
      --occupied-text: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      margin: 0;
    }

    .scoreboard-header {
      background: linear-gradient(135deg, var(--bg-subtle), var(--bg));
      border-bottom: 1px solid var(--border);
    }

    .nav-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .nav-btn:hover {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }

    .nav-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .nav-btn.disabled { opacity: 0.4; cursor: not-allowed; }

    .day-cell {
      aspect-ratio: 1;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 8px 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 2px;
      position: relative;
    }

    .day-cell:hover:not(.empty):not(.free):not(.occupied) { background: var(--accent-dim); }

    .day-cell.free { background: var(--free-bg); color: var(--free-text); }
    .day-cell.free:hover { background: var(--accent-dim); transform: scale(1.05); }

    .day-cell.occupied { background: var(--occupied-bg); color: var(--occupied-text); }
    .day-cell.occupied:hover { background: #c0392b; transform: scale(1.05); }

    .day-cell.empty { background: var(--card); color: var(--muted); }

    .day-number { font-size: 1.2rem; font-weight: 600; margin-bottom: 2px; }
    .day-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.7; }

    .status-badge {
      position: absolute; top: 4px; right: 4px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 2px 6px;
      font-size: 0.55rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .status-badge.free { border-color: var(--accent); color: var(--accent); }
    .status-badge.occupied { border-color: var(--danger); color: var(--danger); }

    .month-nav { display: flex; gap: 10px; margin-bottom: 15px; }
    .month-btn { background: var(--card); border: 1px solid var(--border); color: var(--fg); padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .month-btn:hover { border-color: var(--accent); color: var(--accent); }
    .month-btn.active { background: var(--accent); color: var(--bg); }

    .game-tooltip { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%) translateY(8px);
      background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px;
      font-size: 0.65rem; white-space: nowrap; z-index: 100; min-width: 200px; max-width: 300px; }
    .tooltip-header { font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
    .tooltip-content { font-size: 0.7rem; line-height: 1.4; }
    .tooltip-content .league { font-weight: 600; color: var(--accent); margin-right: 4px; }

    .free-time-info { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-top: 8px; }
    .free-time-item { margin: 4px 0; font-size: 0.85rem; }
    .free-time-label { color: var(--muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; margin-right: 4px; }
    .free-time-windows { color: var(--fg); font-size: 0.8rem; }

    .no-games-text { color: var(--muted); font-size: 0.85rem; text-align: center; padding: 20px; }

    @media (max-width: 640px) { .day-number { font-size: 1rem; } .day-label { font-size: 0.5rem; } }
  </style>
</head>

      cal: {

        // Games with ET times that need conversion to PT
        football: [
          { date: '2026-09-05', opponent: 'vs UCLA Bruins', time: '10:30 PM ET', duration: 204 },
          { date: '2026-09-12', opponent: '@ Syracuse Orange', time: '3:30 PM ET', duration: 204 },

    // Convert ET times to PT
    function convertETtoPT(timeStr) {
      if (!timeStr) return timeStr;
      const match = timeStr.match(/(\d+):(\d+)\s*(AM|PM)\s*(ET|PT)/i);
      if (match) {
        let hours = parseInt(match[1]);
        let mins = parseInt(match[2]);
        let ampm = match[3].toUpperCase();
        let zone = match[4].toUpperCase();
        
        if (ampm === 'AM' && hours === 12) hours = 0;
        if (ampm === 'PM' && hours !== 12) hours += 12;
        
        // Convert ET to PT (subtract 3 hours = 180 minutes)
        let totalMins = hours * 60 + mins - 180;
        if (totalMins < 0) totalMins += 24 * 60;
        if (totalMins >= 24 * 60) totalMins -= 24 * 60;
        
        let newHrs = Math.floor(totalMins / 60);
        let newMins = totalMins % 60;
        
        let newAmpm = newHrs >= 12 ? 'PM' : 'AM';
        let dispHrs = newHrs % 12;
        dispHrs = dispHrs ? dispHrs : 12;
        
        return dispHrs + ':' + (newMins < 10 ? '0' : '') + newMins + ' ' + newAmpm + ' PT';
      }
      return timeStr;
    }

    // Convert all Cal game times from ET to PT
    function convertCalTimes() {
      const calGames = SCHEDULE_DATA.cal.football;
      calGames.forEach(g => {
        const match = g.time.match(/(\d+):(\d+)\s*(AM|PM)\s*(ET|PT)/i);
        if (match && match[4] === 'ET') {
          let hours = parseInt(match[1]);
          let mins = parseInt(match[2]);
          let ampm = match[3].toUpperCase();
          
          if (ampm === 'AM' && hours === 12) hours = 0;
          if (ampm === 'PM' && hours !== 12) hours += 12;
          
          let totalMins = hours * 60 + mins - 180;
          if (totalMins < 0) totalMins += 24 * 60;
          if (totalMins >= 24 * 60) totalMins -= 24 * 60;
          
          let newHrs = Math.floor(totalMins / 60);
          let newMins = totalMins % 60;
          let newAmpm = newHrs >= 12 ? 'PM' : 'AM';
          let dispHrs = newHrs % 12 || 12;
          
          g.ptTime = dispHrs + ':' + (newMins < 10 ? '0' : '') + newMins + ' ' + newAmpm + ' PT';
        } else {
          g.ptTime = g.time;
        }
      });
    }
    
    convertCalTimes();

    // ===== GAME DATE SET =====
    function buildGameDateSet() {
      const gameDates = new Set();
      
      // MLB dates
      SCHEDULE_DATA.mlb.gameDates.forEach(d => gameDates.add(d));
      
      // 49ers preseason
      SCHEDULE_DATA.nfl_49ers.preseason.forEach(g => gameDates.add(g.date));
      // 49ers regular season
      SCHEDULE_DATA.nfl_49ers.regularSeason.forEach(g => gameDates.add(g.date));
      // Earthquakes MLS
      SCHEDULE_DATA.earthquakes.mls.forEach(g => gameDates.add(g.date));
      // Stanford football
      SCHEDULE_DATA.stanford.football.forEach(g => gameDates.add(g.date));
      // Cal football
      SCHEDULE_DATA.cal.football.forEach(g => gameDates.add(g.date));
      
      return gameDates;
    }

    const GAME_DATE_SET = buildGameDateSet();

    // ===== FREE TIME CALCULATION =====
    // Average durations in minutes
    const DURATIONS = {
      mlb: SCHEDULE_DATA.mlb.avgDuration,
      nfl: SCHEDULE_DATA.nfl_49ers.avgDuration,
      mlssoccer: SCHEDULE_DATA.earthquakes.avgDuration,
      stanford: SCHEDULE_DATA.stanford.avgDuration,
      cal: SCHEDULE_DATA.cal.avgDuration
    };

    function getGamesOnDate(dateStr) {
      const games = [];
      
      // Check 49ers preseason
      SCHEDULE_DATA.nfl_49ers.preseason.forEach(g => { if (g.date === dateStr) games.push({ league: 'NFL 49ers (Preseason)', time: g.time, duration: DURATIONS.nfl }); });
      // Check 49ers regular season
      SCHEDULE_DATA.nfl_49ers.regularSeason.forEach(g => { if (g.date === dateStr) games.push({ league: 'NFL 49ers (Regular)', time: g.time, duration: DURATIONS.nfl }); });
      // Check Earthquakes
      SCHEDULE_DATA.earthquakes.mls.forEach(g => { if (g.date === dateStr) games.push({ league: 'MLS Earthquakes', time: g.time, duration: DURATIONS.mlssoccer }); });
      // Check Stanford
      SCHEDULE_DATA.stanford.football.forEach(g => { if (g.date === dateStr) games.push({ league: 'Stanford Football', time: g.time, duration: DURATIONS.stanford }); });
      // Check Cal (use ptTime if available)
      SCHEDULE_DATA.cal.football.forEach(g => { if (g.date === dateStr) games.push({ league: 'Cal Football', time: g.ptTime || g.time, duration: DURATIONS.cal }); });

      return games;
    }

    function calculateFreeTimeWindows(dateStr) {
      const games = getGamesOnDate(dateStr);
      
      if (games.length === 0) {
        return { isFree: true, windows: [{ start: '12:00 AM', end: '11:59 PM', label: 'FREE DAY' }], busyPeriods: [] };
      }
      
      // Initialize 30-minute slots from 12:00 AM to 11:30 PM
      const slots = [];
      for (let h = 0; h < 24; h++) {
        for (let m = 0; m < 60; m += 30) {
          slots.push({ hour: h, minute: m, occupied: false });
        }
      }
      
      // Mark game slots as occupied
      games.forEach(game => {
        const timeMatch = game.time.match(/(\d+):(\d+)\s*(AM|PM)/i);
        if (!timeMatch) return;
        
        let hours = parseInt(timeMatch[1]);
        let mins = parseInt(timeMatch[2]);
        let ampm = timeMatch[3].toUpperCase();
        
        // Convert to 24-hour
        if (ampm === 'AM' && hours === 12) hours = 0;
        if (ampm === 'PM' && hours !== 12) hours += 12;
        
        // Calculate end time in minutes from midnight
        const gameEndMin = hours * 60 + mins + game.duration;
        const endHrs = Math.floor(gameEndMin / 60) % 24;
        const endMin = gameEndMin % 60;
        
        // Mark each 30-minute slot as occupied
        let slotIndex = hours * 60 + mins;
        const slotsPerGame = Math.ceil(game.duration / 30);
        
        for (let s = 0; s < slotsPerGame; s++) {
          const absMin = slotIndex + s * 30;
          const slotHr = Math.floor(absMin / 60) % 24;
          const slotMin = absMin % 60;
          
          const slot = slots.find(s => s.hour === slotHr && s.minute === slotMin);
          if (slot) slot.occupied = true;
        }
      });
      
      // Find free windows
      const freeWindows = [];
      let inFreeWindow = false;
      let windowStart = null;
      
      slots.forEach((slot, index) => {
        if (!slot.occupied) {
          if (!inFreeWindow) {
            windowStart = { hour: slot.hour, minute: slot.minute };
            inFreeWindow = true;
          }
        } else {
          if (inFreeWindow) {
            freeWindows.push({
              start: pad(windowStart.hour) + ':' + pad(windowStart.minute) + ' PT',
              end: pad(slot.hour) + ':' + pad(slot.minute) + ' PT',
              label: 'Free time'
            });
            inFreeWindow = false;
          }
        }
      });
      
      // Window that extends to end of day
      if (inFreeWindow) {
        freeWindows.push({
          start: pad(windowStart.hour) + ':' + pad(windowStart.minute) + ' PT',
          end: '11:59 PM PT',
          label: 'Free time'
        });
      }
      
      return { isFree: freeWindows.length > 0 || games.length === 0, windows: freeWindows, busyPeriods: games.length };
    }

    function pad(num) { return num < 10 ? '0' + num : num; }

    // ===== RENDER CALENDAR =====
    function getMonthRange(year, monthIdx) {
      const start = new Date(year, monthIdx, 1);
      const end = new Date(year, monthIdx + 1, 0);
      return { start, end, numDays: end.getDate() };
    }

    function getMonthName(monthIdx) {
      const names = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      return names[monthIdx];
    }

    function generateCalendarDays(year, monthIdx) {
      const { start, end, numDays } = getMonthRange(year, monthIdx);
      const firstDayIdx = start.getDay(); // 0=Sunday, 1=Monday, ...
      
      const days = [];
      
      // Add leading empty cells to align with actual calendar start
      // If Jan 1 is Monday (1), we need 1 empty cell before it
      for (let i = 0; i < firstDayIdx; i++) {
        days.push({ type: 'empty', date: null, day: null });
      }
      
      // Add actual days of the month
      for (let day = 1; day <= numDays; day++) {
        const currentDate = new Date(year, monthIdx, day);
        const dateStr = currentDate.toISOString().split('T')[0];
        const dayName = currentDate.toLocaleDateString(undefined, { weekday: 'short' });
        const isToday = currentDate.toISOString().split('T')[0] === new Date().toISOString().split('T')[0];
        const isFree = !GAME_DATE_SET.has(dateStr);
        
        days.push({
          type: isFree ? 'free' : 'occupied',
          date: day,
          dateStr: dateStr,
          dayName: dayName,
          isCurrentMonth: true,
          isToday: isToday
        });
      }
      
      return days;
    }

    function renderCalendar(year, monthIdx) {
      const days = generateCalendarDays(year, monthIdx);
      const container = document.getElementById('calendar-grid');
      const monthDisplay = document.getElementById('current-month-display');
      
      monthDisplay.textContent = `${getMonthName(monthIdx)} ${year}`;
      
      container.innerHTML = '';
      
      days.forEach(day => {
        const cell = document.createElement('div');
        
        if (day.type === 'empty') {
          cell.className = 'day-cell empty';
          cell.innerHTML = '';
          container.appendChild(cell);
          return;
        }
        
        const dateStr = day.dateStr;
        const isFree = day.type === 'free';
        const isToday = day.isToday;
        
        cell.className = `day-cell ${isFree ? 'free' : 'occupied'} ${isToday ? 'today' : ''}`;
        
        // Get games and calculate free time windows
        const gamesInfo = calculateFreeTimeWindows(dateStr);
        
        let content = '';
        content += `<span class="day-number">${day.date}</span>`;
        content += `<span class="day-label">${day.dayName}</span>`;
        
        if (isFree) {
          content += `<span class="status-badge free">FREE</span>`;
          content += `<div class="free-time-info">
            <div class="free-time-label">Free Time Windows:</div>
            <div class="free-time-windows">${gamesInfo.windows.map(w => w.label).join(' · ')}</div>
          </div>`);
        } else {
          content += `<span class="status-badge occupied">G</span>`;
          // Show first game for reference
          const firstGame = gamesInfo.windows.length > 0 ? '' : '';
          content += `<div class="free-time-info compact">
            <div class="free-time-label">Games:</div>
            <div class="free-time-windows">${gamesInfo.windows.length > 0 ? gamesInfo.windows.map(w => `${gamesInfo.windows.length} windows}` : 'Busy').join(', ')}</div>
          </div>`);
        }
        
        // Tooltip on hover
        cell.addEventListener('mouseenter', (e) => showTooltip(e, dateStr));
        cell.addEventListener('mouseleave', hideTooltip);
        cell.addEventListener('click', () => navigateToDate(year, monthIdx, day.date));
        
        cell.innerHTML = content;
        container.appendChild(cell);
      });
      
      // Nav button states
      const prevBtn = document.querySelector('.prev-day');
      const nextBtn = document.querySelector('.next-day');
      prevBtn.disabled = monthIdx <= 7; // August is month 7
      nextBtn.disabled = monthIdx >= 10; // October is month 10
    }

    // ===== TOOLTIP =====
    function showTooltip(event, dateStr) {
      const tooltip = document.getElementById('tooltip');
      const tooltipContent = document.getElementById('tooltip-content');
      const tooltipTitle = document.getElementById('tooltip-title');
      
      const games = getGamesOnDate(dateStr);
      
      if (games.length === 0) {
        tooltip.style.display = 'none';
        return;
      }
      
      tooltipTitle.textContent = `Games on ${dateStr}`;
      tooltipContent.innerHTML = games.map(g => `
        <div class="tooltip-content">
          <span class="league">${g.league}</span> ${g.time} (${gameDurationStr(g.duration)})
        </div>
      `).join('');
      
      tooltip.style.display = 'block';
      tooltip.style.left = `${event.pageX}px`;
      tooltip.style.top = `${event.pageY - 10}px`;
    }

    function hideTooltip() { document.getElementById('tooltip').style.display = 'none'; }

    function gameDurationStr(minutes) {
      const hrs = Math.floor(minutes / 60);
      const mins = minutes % 60;
      return hrs > 0 ? `${hrs}h ${mins}m` : `${mins}min`;
    }

    // ===== NAVIGATION =====
    function navigateToDate(year, monthIdx, day) {
      renderCalendar(year, monthIdx);
    }

    document.querySelector('.prev-day').addEventListener('click', () => {
      const displayed = document.getElementById('current-month-display').textContent;
      const [yearStr, monthStr] = displayed.split(' ');
      const year = parseInt(yearStr);
      const month = ['January','February','March','April','May','June','July','August','September','October','November','December'].indexOf(monthStr);
      
      if (month > 7) navigateToDate(year, month - 1, 1);
    });

    document.querySelector('.next-day').addEventListener('click', () => {
      const displayed = document.getElementById('current-month-display').textContent;
      const [yearStr, monthStr] = displayed.split(' ');
      const year = parseInt(yearStr);
      const month = ['January','February','March','April','May','June','July','August','September','October','November','December'].indexOf(monthStr);
      
      if (month < 10) navigateToDate(year, month + 1, 1);
    });

    document.querySelector('.prev-month').addEventListener('click', () => {
      const month = monthIdx - 1;
      if (month >= 7) renderCalendar(2026, month);
    });

    document.querySelector('.next-month').addEventListener('click', () => {
      const month = monthIdx + 1;
      if (month <= 10) renderCalendar(2026, month);
    });

    // Initialize - start with August 2026
    const year = 2026;
    const monthIdx = 7; // August (0-indexed: 0=Jan, 7=Aug)
    renderCalendar(year, monthIdx);
  </script>
</body>
</html>
